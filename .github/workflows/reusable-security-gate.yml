name: Reusable Security Gate

# Reusable CI/CD security gate. Call from any repo via `workflow_call`.
#
# Pipeline:
#   detect       -> figures out which stacks/languages the caller repo uses
#   secrets-scan -> Gitleaks (full git history, findings always fail the gate)
#   sast         -> Semgrep (multi-language static analysis, severity-gated)
#   sca          -> OSV-Scanner (dependency vulnerabilities, CVSS-gated)
#   iac          -> Checkov (Terraform / CloudFormation / K8s / Helm / Dockerfile)
#   gate         -> aggregates results into a single required check
#
# Supply chain:
#   * Every third-party action is pinned to a full commit SHA (the tag is kept
#     in a trailing comment for readability). Moving tags were the attack
#     vector in the March 2026 trivy-action / setup-trivy compromise.
#   * Scanner binaries are downloaded from official GitHub releases at a fixed
#     version and verified against a hard-coded SHA-256 before use.
#   * The Semgrep container image is pinned to a release tag AND its digest.
#   * Checkov is installed from PyPI at a fixed version.
#   Bump versions in the `env` block below (and the Semgrep image on the `sast`
#   job); the README "Supply chain" section explains where to find checksums.
#
# Shell safety: workflow inputs are never interpolated into `run:` scripts.
# They are passed through `env:` and referenced as quoted shell variables.

on:
  workflow_call:
    inputs:
      scan-path:
        description: "Path within the caller repo to scan (Semgrep scan mode, OSV-Scanner, Checkov). Gitleaks and `semgrep ci` always scan the whole repo."
        type: string
        default: "."
      fail-on-severity:
        description: "Minimum severity that fails the gate: critical | high | medium | low"
        type: string
        default: "high"
      semgrep-rulesets:
        description: "Space-separated Semgrep registry rulesets (ignored when SEMGREP_APP_TOKEN is set)"
        type: string
        default: "p/default p/owasp-top-ten p/secrets"
      semgrep-custom-rules:
        description: "Path (in the caller repo) to a directory or file of extra Semgrep rules; used only if it exists (ignored when SEMGREP_APP_TOKEN is set)"
        type: string
        default: "semgrep-rules"
      gitleaks-config:
        description: "Path (in the caller repo) to a gitleaks.toml; used only if it exists"
        type: string
        default: "gitleaks.toml"
      enable-secrets-scan:
        type: boolean
        default: true
      enable-sast:
        type: boolean
        default: true
      enable-sca:
        type: boolean
        default: true
      enable-iac:
        type: boolean
        default: true
      upload-sarif:
        description: "Upload SARIF to GitHub code scanning (needs security-events: write; ignored gracefully if unavailable)"
        type: boolean
        default: true
    secrets:
      SEMGREP_APP_TOKEN:
        required: false

# Single place to bump scanner versions. Update the checksum together with the
# version - the checksum is what actually protects the download.
env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"   # gitleaks_8.30.1_linux_x64.tar.gz
  OSV_SCANNER_VERSION: "2.5.1"
  OSV_SCANNER_SHA256: "f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be"   # osv-scanner_linux_amd64
  CHECKOV_VERSION: "3.3.16"
  # Semgrep: the image tag + digest live on `jobs.sast.container.image` because
  # the `env` context is not available there.

defaults:
  run:
    shell: bash   # bash -eo pipefail, explicitly, in every job (including the Semgrep container)

jobs:
  detect:
    name: Detect stacks & severity threshold
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      stacks: ${{ steps.d.outputs.stacks }}
      has_iac: ${{ steps.d.outputs.has_iac }}
      semgrep_sev_flags: ${{ steps.sev.outputs.semgrep_flags }}
      min_cvss: ${{ steps.sev.outputs.min_cvss }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - id: sev
        name: Map fail-on-severity to per-tool thresholds
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          case "$FAIL_ON_SEVERITY" in
            critical) min_cvss="9.0"; semgrep_flags="--severity ERROR" ;;
            high)     min_cvss="7.0"; semgrep_flags="--severity ERROR" ;;
            medium)   min_cvss="4.0"; semgrep_flags="--severity ERROR --severity WARNING" ;;
            low)      min_cvss="0.1"; semgrep_flags="" ;;
            *) echo "::error::Invalid fail-on-severity '$FAIL_ON_SEVERITY' (use critical|high|medium|low)"; exit 1 ;;
          esac
          echo "min_cvss=$min_cvss"        >> "$GITHUB_OUTPUT"
          echo "semgrep_flags=$semgrep_flags" >> "$GITHUB_OUTPUT"

      - id: d
        name: Detect languages and IaC
        working-directory: ${{ inputs.scan-path }}
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          # f NAME -> true if any file matching NAME exists (skipping .git, node_modules, vendor).
          # Uses $(...) rather than "| grep -q" so pipefail cannot turn an early exit into a miss.
          f() { [ -n "$(find . \( -path './.git' -o -path '*/node_modules' -o -path '*/vendor' \) -prune -o -iname "$1" -print -quit)" ]; }
          stacks=""
          add() { stacks="${stacks:+$stacks, }$1"; }

          { f 'pyproject.toml' || f 'requirements*.txt' || f 'setup.py' || f 'Pipfile'; } && add python
          f 'package.json'   && add node
          f 'go.mod'         && add go
          { f 'pom.xml' || f 'build.gradle*'; } && add java
          f 'Gemfile'        && add ruby
          f 'composer.json'  && add php
          f 'Cargo.toml'     && add rust
          { f '*.csproj' || f '*.sln'; } && add dotnet

          has_iac=false
          f 'Dockerfile*'    && { add docker; has_iac=true; }
          f 'Containerfile'  && { add docker; has_iac=true; }
          f '*.tf'           && { add terraform; has_iac=true; }
          f 'Chart.yaml'     && { add helm; has_iac=true; }
          k8s_or_cfn=$(grep -rEl --include='*.yml' --include='*.yaml' --exclude-dir=.git --exclude-dir=node_modules \
                         '^(apiVersion:|AWSTemplateFormatVersion)' . 2>/dev/null | head -n1 || true)
          if [ -n "$k8s_or_cfn" ]; then
            add k8s-or-cfn; has_iac=true
          fi

          echo "stacks=${stacks:-none detected}" >> "$GITHUB_OUTPUT"
          echo "has_iac=$has_iac"                >> "$GITHUB_OUTPUT"
          {
            echo "### Security gate"
            echo "- **Detected stacks:** ${stacks:-none detected}"
            echo "- **Fail threshold:** $FAIL_ON_SEVERITY"
          } >> "$GITHUB_STEP_SUMMARY"

  secrets-scan:
    name: Secrets (Gitleaks)
    if: ${{ inputs.enable-secrets-scan }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No `permissions:` on the scan jobs: a called workflow may only reduce the
    # caller's grant, and requesting `security-events: write` when the caller did
    # not grant it fails the job outright. Callers set the minimal set (see
    # README); `upload-sarif` degrades gracefully when the permission is missing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0   # scan the full history, not just HEAD

      - name: Install Gitleaks (pinned, checksum-verified)
        run: |
          install -d "$RUNNER_TEMP/gitleaks"
          curl --proto '=https' --tlsv1.2 -sSfL --retry 3 \
            -o "$RUNNER_TEMP/gitleaks/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Run Gitleaks
        env:
          GITLEAKS_CONFIG_PATH: ${{ inputs.gitleaks-config }}   # not GITLEAKS_CONFIG: that name is read by gitleaks itself
        run: |
          # Scans the whole repository history; `scan-path` does not apply here.
          args=(git --redact --exit-code 1 --report-format sarif --report-path gitleaks.sarif .)
          if [ -f "$GITLEAKS_CONFIG_PATH" ]; then
            args+=(--config "$GITLEAKS_CONFIG_PATH")
          fi
          gitleaks "${args[@]}"

      - name: Upload SARIF to code scanning
        if: ${{ always() && inputs.upload-sarif }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938   # v4.37.9
        with:
          sarif_file: gitleaks.sarif
          category: security-gate-gitleaks

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        if: always()
        # The report artifact is a convenience copy; the SARIF already reached
        # code scanning in the previous step. An artifact-service error (seen
        # 2026-09-08 on CarDuarte/password-manager main: "Failed to
        # FinalizeArtifact ... (403) Forbidden: Error from intermediary" after
        # a clean Gitleaks scan) must not turn a passing scan into a failed
        # gate. The scan step above still fails the job on real findings.
        continue-on-error: true
        with:
          name: security-gate-gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore

  sast:
    name: SAST (Semgrep)
    if: ${{ inputs.enable-sast }}
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # Official image, pinned to a release tag and its multi-arch index digest.
      # Alpine-based, runs as root, ships git and bash; the runner provides a musl
      # Node build so actions/checkout works inside it (Semgrep's documented setup).
      image: semgrep/semgrep:1.176.0@sha256:12672acdb0949e19f9f6a4c2b288edd0b404f268f0ca7738a2c06f372f50362e
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Run Semgrep
        env:
          SEMGREP_SEV_FLAGS: ${{ needs.detect.outputs.semgrep_sev_flags }}
          SEMGREP_RULESETS: ${{ inputs.semgrep-rulesets }}
          SEMGREP_CUSTOM_RULES: ${{ inputs.semgrep-custom-rules }}
          SCAN_PATH: ${{ inputs.scan-path }}
        run: |
          read -ra sev_flags <<< "$SEMGREP_SEV_FLAGS"
          if [ -n "$SEMGREP_APP_TOKEN" ]; then
            # Logged-in mode: rules/policies come from the Semgrep AppSec Platform.
            # `semgrep ci` always scans the whole checkout; scan-path, rulesets and
            # custom rules do not apply in this mode.
            semgrep ci "${sev_flags[@]}" --sarif --output semgrep.sarif
          else
            cfg=()
            read -ra rulesets <<< "$SEMGREP_RULESETS"
            for r in "${rulesets[@]}"; do cfg+=(--config "$r"); done
            if [ -e "$SEMGREP_CUSTOM_RULES" ]; then
              cfg+=(--config "$SEMGREP_CUSTOM_RULES")
            fi
            semgrep scan "${cfg[@]}" "${sev_flags[@]}" --error --metrics=off \
              --sarif --output semgrep.sarif "$SCAN_PATH"
          fi

      - name: Upload SARIF to code scanning
        if: ${{ always() && inputs.upload-sarif }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938   # v4.37.9
        with:
          sarif_file: semgrep.sarif
          category: security-gate-semgrep

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        if: always()
        # The report artifact is a convenience copy; the SARIF already reached
        # code scanning in the previous step. An artifact-service error (seen
        # 2026-09-08 on CarDuarte/password-manager main: "Failed to
        # FinalizeArtifact ... (403) Forbidden: Error from intermediary" after
        # a clean Gitleaks scan) must not turn a passing scan into a failed
        # gate. The scan step above still fails the job on real findings.
        continue-on-error: true
        with:
          name: security-gate-semgrep-report
          path: semgrep.sarif
          if-no-files-found: ignore

  sca:
    name: Dependencies (OSV-Scanner)
    if: ${{ inputs.enable-sca }}
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Install OSV-Scanner (pinned, checksum-verified)
        run: |
          install -d "$RUNNER_TEMP/osv"
          curl --proto '=https' --tlsv1.2 -sSfL --retry 3 \
            -o "$RUNNER_TEMP/osv/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  ${RUNNER_TEMP}/osv/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv/osv-scanner"
          echo "$RUNNER_TEMP/osv" >> "$GITHUB_PATH"

      - name: Run OSV-Scanner
        env:
          SCAN_PATH: ${{ inputs.scan-path }}
          MIN_CVSS: ${{ needs.detect.outputs.min_cvss }}
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        run: |
          # OSV-Scanner accepts a single --format per run, so it runs twice: the JSON
          # drives the CVSS gate below, the SARIF feeds code scanning. Both runs query
          # the osv.dev API; the second one is best-effort.
          ec=0
          osv-scanner scan source --recursive --format json --output osv.json "$SCAN_PATH" || ec=$?
          osv-scanner scan source --recursive --format sarif --output osv.sarif "$SCAN_PATH" \
            || echo "::warning::osv-scanner SARIF run exited $? - no SARIF will be uploaded for this scan"

          # 0 = clean, 1 = vulns found (gate below by CVSS), 128 = no packages found
          if [ "$ec" = "0" ] || [ "$ec" = "128" ]; then
            echo "No known vulnerabilities (or no supported package manifests) found."
            exit 0
          elif [ "$ec" != "1" ]; then
            echo "::error::osv-scanner failed with exit code $ec"
            exit "$ec"
          fi

          # Gate on CVSS >= threshold; vulns with no recorded severity are treated as failing (conservative).
          count=$(jq --arg min "$MIN_CVSS" '
            ($min | tonumber) as $min
            | [ .results[]?.packages[]?.groups[]?
              | (.max_severity // "") as $s
              | select($s == "" or (($s | tonumber? // 10) >= $min)) ] | length' osv.json)
          total=$(jq '[ .results[]?.packages[]?.groups[]? ] | length' osv.json)
          echo "Vulnerability groups found: $total; at or above threshold (CVSS >= $MIN_CVSS): $count"
          if [ "$count" -gt 0 ]; then
            echo "::error::$count dependency vulnerability group(s) at or above the '$FAIL_ON_SEVERITY' threshold"
            exit 1
          fi

      - name: Upload SARIF to code scanning
        if: ${{ always() && inputs.upload-sarif }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938   # v4.37.9
        with:
          sarif_file: osv.sarif
          category: security-gate-osv

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        if: always()
        # The report artifact is a convenience copy; the SARIF already reached
        # code scanning in the previous step. An artifact-service error (seen
        # 2026-09-08 on CarDuarte/password-manager main: "Failed to
        # FinalizeArtifact ... (403) Forbidden: Error from intermediary" after
        # a clean Gitleaks scan) must not turn a passing scan into a failed
        # gate. The scan step above still fails the job on real findings.
        continue-on-error: true
        with:
          name: security-gate-osv-report
          path: |
            osv.json
            osv.sarif
          if-no-files-found: ignore

  iac:
    name: IaC (Checkov)
    if: ${{ inputs.enable-iac && needs.detect.outputs.has_iac == 'true' }}
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Install Checkov (pinned)
        run: pipx install "checkov==${CHECKOV_VERSION}"

      - name: Run Checkov
        env:
          SCAN_PATH: ${{ inputs.scan-path }}
        run: |
          # --output-file-path pairs positionally with the -o formats:
          #   cli -> console, sarif -> checkov.sarif
          # Checkov writes the SARIF before exiting, then exits 1 on failed checks,
          # which fails this step; the always() steps below still find the report.
          checkov --directory "$SCAN_PATH" \
            --framework terraform cloudformation kubernetes helm dockerfile \
            -o cli -o sarif --output-file-path console,checkov.sarif \
            --quiet --compact

      - name: Upload SARIF to code scanning
        if: ${{ always() && inputs.upload-sarif }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938   # v4.37.9
        with:
          sarif_file: checkov.sarif
          category: security-gate-checkov

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        if: always()
        # The report artifact is a convenience copy; the SARIF already reached
        # code scanning in the previous step. An artifact-service error (seen
        # 2026-09-08 on CarDuarte/password-manager main: "Failed to
        # FinalizeArtifact ... (403) Forbidden: Error from intermediary" after
        # a clean Gitleaks scan) must not turn a passing scan into a failed
        # gate. The scan step above still fails the job on real findings.
        continue-on-error: true
        with:
          name: security-gate-checkov-report
          path: checkov.sarif
          if-no-files-found: ignore

  gate:
    name: Security gate result
    needs: [detect, secrets-scan, sast, sca, iac]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}   # no checkout, no API calls: needs nothing
    steps:
      - name: Evaluate results
        env:
          FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
          RESULT_DETECT: ${{ needs.detect.result }}
          RESULT_SECRETS: ${{ needs['secrets-scan'].result }}
          RESULT_SAST: ${{ needs.sast.result }}
          RESULT_SCA: ${{ needs.sca.result }}
          RESULT_IAC: ${{ needs.iac.result }}
        run: |
          declare -A results=(
            ["Stack detection"]="$RESULT_DETECT"
            ["Secrets (Gitleaks)"]="$RESULT_SECRETS"
            ["SAST (Semgrep)"]="$RESULT_SAST"
            ["Dependencies (OSV-Scanner)"]="$RESULT_SCA"
            ["IaC (Checkov)"]="$RESULT_IAC"
          )
          {
            echo "### Security gate results (threshold: $FAIL_ON_SEVERITY)"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for name in "Stack detection" "Secrets (Gitleaks)" "SAST (Semgrep)" "Dependencies (OSV-Scanner)" "IaC (Checkov)"; do
            r="${results[$name]}"
            case "$r" in
              success) icon="✅ passed" ;;
              skipped) icon="⏭️ skipped" ;;
              *)       icon="❌ $r"; failed=1 ;;
            esac
            echo "| $name | $icon |" >> "$GITHUB_STEP_SUMMARY"
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::Security gate failed - see individual scan jobs and the Security tab for findings."
            exit 1
          fi
          echo "Security gate passed."
